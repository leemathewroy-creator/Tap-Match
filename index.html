
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tap Match Arcade</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND MUSIC -->
    <audio id="backgroundMusic" loop preload="auto">
        <source src="background-music.mp3" type="audio/mpeg">
    </audio>

    <!-- ARCADE MACHINE -->
    <main class="arcade-machine">

        <section class="game-screen">

            <!-- GAME TITLE -->
            <header class="game-header">
                <h1>TAP MATCH</h1>
                <p>MATCH THREE IDENTICAL ICONS!</p>
            </header>

            <!-- MAIN SCOREBOARD -->
            <div class="game-info">

                <div class="info-box">
                    <span>LEVEL</span>
                    <h2 id="level">1</h2>
                </div>

                <div class="info-box">
                    <span>MOVES</span>
                    <h2 id="moves">0</h2>
                </div>

                <div class="info-box">
                    <span>TIME</span>
                    <h2 id="timer">05:00</h2>
                </div>

                <div class="info-box">
                    <span>REMAINING</span>
                    <h2 id="remaining">30</h2>
                </div>

            </div>

            <!-- EXTRA SCOREBOARD -->
            <div class="extra-info">

                <div class="extra-box">
                    <span>SCORE</span>
                    <h2 id="score">0</h2>
                </div>

                <div class="extra-box">
                    <span>BEST SCORE</span>
                    <h2 id="bestScore">0</h2>
                </div>

                <div class="extra-box">
                    <span>COMBO</span>
                    <h2 id="combo">x0</h2>
                </div>

                <div class="extra-box">
                    <span>HINTS LEFT</span>
                    <h2 id="hints">3</h2>
                </div>

            </div>

            <!-- GAME BOARD -->
            <div class="game-board" id="gameBoard">
                <!-- Fruit icons generated by JavaScript -->
            </div>

            <!-- COLLECTION BAR -->
            <div class="collection-container">

                <p>YOUR COLLECTION</p>

                <div class="collection-bar" id="collectionBar">

                    <div class="slot"></div>
                    <div class="slot"></div>
                    <div class="slot"></div>
                    <div class="slot"></div>
                    <div class="slot"></div>
                    <div class="slot"></div>
                    <div class="slot"></div>

                </div>

            </div>

            <!-- GAME CONTROLS -->
            <div class="game-controls">

                <button id="hintBtn">
                    💡 HINT (3)
                </button>

                <button id="restartBtn">
                    ↻ RESTART
                </button>

                <button id="soundBtn">
                    🔊 SOUND ON
                </button>

            </div>

            <!-- STATUS MESSAGE -->
            <p id="statusMessage" class="status-message">
                Find three matching icons!
            </p>

            <!-- END GAME SCREEN -->
            <div id="endScreen" class="end-screen">

                <h2 id="endTitle">
                    GAME OVER!
                </h2>

                <p id="endDescription"></p>

                <button onclick="restartGame()">
                    PLAY AGAIN
                </button>

            </div>

        </section>

    </main>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
